name: Deploy Recipe Nexus

on:
  push:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Instalar dependencias del backend
        working-directory: ./Backend
        run: pnpm install

      - name: Correr tests del backend
        working-directory: ./Backend
        run: pnpm test
        env:
          JWT_SECRET: test_secret_for_ci
          MONGO_URI: mongodb://localhost:27017/test

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Instalar dependencias del frontend
        working-directory: ./frontend
        run: pnpm install

      - name: Build del frontend
        working-directory: ./frontend
        run: pnpm run build
        env:
          VITE_API_URL: https://api.recipe-nexus.xyz

      - name: Copiar build al VPS por SSH
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "frontend/dist/*"
          target: "/var/www/recipe-nexus/recipe-nexus/frontend/dist"
          strip_components: 2

      - name: Deploy en VPS por SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /var/www/recipe-nexus/recipe-nexus
            git pull origin main
            docker compose down
            docker compose up --build -d
            sleep 10

      - name: Health check post-deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            curl -f https://api.recipe-nexus.xyz/api/health