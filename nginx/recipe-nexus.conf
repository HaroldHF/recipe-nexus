server {
    listen 80;
    server_name api.recipe-nexus.xyz app.recipe-nexus.xyz;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name api.recipe-nexus.xyz;

    ssl_certificate     /etc/letsencrypt/live/api.recipe-nexus.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.recipe-nexus.xyz/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass         http://localhost:4000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}

server {
    listen 443 ssl;
    server_name app.recipe-nexus.xyz;

    ssl_certificate     /etc/letsencrypt/live/app.recipe-nexus.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.recipe-nexus.xyz/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/recipe-nexus/recipe-nexus/frontend/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
}